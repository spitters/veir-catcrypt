name = "VeIR"
version = "0.1.0"
defaultTargets = ["veir-opt", "veir-interpret", "run-benchmarks", "veir2mir", "Veir"]
testRunner = "UnitTest"
buildType = "release"
moreLeanArgs = ["--tstack=400000"]
moreServerArgs = ["--tstack=400000"]

[[require]]
name = "lean-ctrees"
path = "lean-ctrees"

[[require]]
name = "ExArray"
path = "ExArray"

[[lean_lib]]
name = "Veir"
root = "Veir"

[[lean_lib]]
name = "UnitTest"
root = "UnitTest"

[[lean_exe]]
name = "veir-opt"
root = "Exe.VeirOpt"

[[lean_exe]]
name = "run-benchmarks"
root = "Exe.RunBenchmarks"

[[lean_exe]]
name = "veir-interpret"
root = "Exe.VeirInterpret"

[[lean_exe]]
name = "veir2mir"
root = "Exe.VeirToMIR"

[[require]]
name = "refinement-wp"
git = "https://github.com/spitters/refinement-wp"
rev = "01ed70e1fe5f6b6801098fc438f25e1ba7e03757"
